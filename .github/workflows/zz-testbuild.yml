name: Test Build Debug APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Grant gradlew permissions
        run: chmod +x gradlew
      - name: Build stbeta debug APK
        run: ./gradlew clean assembleStbetaDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: smarttube-stbeta-debug-apk
          path: smarttubetv/build/outputs/apk/stbeta/debug/*.apk
          if-no-files-found: error
